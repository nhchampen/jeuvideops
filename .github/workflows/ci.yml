name: Continuous Integration Orchestrator

on:
  push:
  pull_request: 
    branches: [ main, master ]
  workflow_dispatch:

jobs: 
  # Job 1 : Test for the game Two Ships
  test-two-ships:
    name: Test Two Ships
    runs-on: ubuntu-latest
    uses: ./.github/workflows/reusable-game-check.yml
    with:
      game-path: games/two-shops-passing-in-the-night

  # Job 2 : Test for the game space word
  test-space-word:
    name: Test Space word
    runs-on: ubuntu-latest
    uses: ./.github/workflows/reusable-game-check.yml
    with:
      game-path: games/spaceword