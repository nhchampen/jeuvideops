name: Reusable Game Check

on:
  workflow_call:
    inputs:
      game-path:
        required: true
        type: string

jobs:
  lint-test-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Get safe artifact name
        id: safe-name
        run: |
          SAFE_NAME=$(echo "${{ inputs.game-path }}" | tr '/' '-')
          echo "safe_name=$SAFE_NAME" >> $GITHUB_OUTPUT

      - name: Install dependencies
        run: |
          cd ${{ inputs.game-path }}
          npm install

      - name: Run linter
        run: |
          cd ${{ inputs.game-path }}
          npm run lint || true

      - name: Run tests
        run: |
          cd ${{ inputs.game-path }}
          npm test || true

      - name: Run npm audit
        run: |
          cd ${{ inputs.game-path }}
          npm audit --json > audit-report.json || true

      - name: Upload audit report
        uses: actions/upload-artifact@v4
        with:
          name: audit-report-${{ steps.safe-name.outputs.safe_name }}
          path: ${{ inputs.game-path }}/audit-report.json
          retention-days: 7