name: Reusable Game Check

on:
  workflow_call:
    inputs:
      game-path:
        required: true
        type: string

jobs:
  lint-test-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check for package-lock.json
        id: check_lock
        run: |
          if [ -f "${{ inputs.game-path }}/package-lock.json" ]; then
            echo "has_lock=true" >> $GITHUB_OUTPUT
          else
            echo "has_lock=false" >> $GITHUB_OUTPUT
          fi

      - name: Setup Node.js (with cache)
        if: steps.check_lock.outputs.has_lock == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ${{ inputs.game-path }}/package-lock.json

      - name: Setup Node.js (without cache)
        if: steps.check_lock.outputs.has_lock == 'false'
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install root dependencies
        run: |
          if [ -f "package.json" ]; then
            if [ -f "package-lock.json" ]; then
              npm ci
            else
              npm install
            fi
          fi

      - name: Install game dependencies
        working-directory: ${{ inputs.game-path }}
        run: |
          if [ -f "package.json" ]; then
            if [ -f "package-lock.json" ]; then
              npm ci
            else
              npm install
            fi
          fi

      - name: Unit Tests
        run: npx jest --projects ${{ inputs.game-path }} --testPathPattern="utils.test.js" --ci

      - name: Functional Tests
        run: npx jest --projects ${{ inputs.game-path }} --testPathPattern="functional.test.js" --ci

      - name: Run npm audit
        working-directory: ${{ inputs.game-path }}
        run: |
          if [ -f "package.json" ]; then
            npm audit --json > audit-report.json || true
          else
            echo "{}" > audit-report.json
          fi

      - name: Generate safe artifact name
        id: artifact-name
        run: |
          GAME_NAME=$(basename "${{ inputs.game-path }}")
          SAFE_NAME=$(echo "$GAME_NAME" | sed 's/[^a-zA-Z0-9-]/-/g')
          echo "safe_name=$SAFE_NAME" >> $GITHUB_OUTPUT

      - name: Upload audit report
        uses: actions/upload-artifact@v4
        with:
          name: audit-report-${{ steps.artifact-name.outputs.safe_name }}-${{ github.run_id }}
          path: ${{ inputs.game-path }}/audit-report.json
          retention-days: 7