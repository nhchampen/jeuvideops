name: Reusable Game Check

# Allowed to be call by an other workflow
on:
  workflow_call:
    inputs:
      game-path:
        required: true
        type: string
        description: './games/*'

jobs:
  check:
    name: Lint, test & Audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.game-path }} # All the commands exec in that directory
  
    steps:
      # Step 1 : Get source code
      - name: Checkout repository
        uses: actions/checkout@v4

      # Step 2 : Install Node.js (with cache if allowed)
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with: 
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ${{ inputs.game-path }}/package-lock.json
        continue-on-error: true # Doesn't block if cached failed

      # Step 3 : Install dependencies (if package.json available)
      - name: Install dependencies
        run: |
          if [ -f "package.json" ]; then
            echo "Installing dependencies..."
            npm ci
          else
            echo "No package.json found, skipping npm install"
          fi

      # Placeholder for futurs steps
      # Changes echo with the real commands
      - name: Unit Tests
        run: echo "TODO:\ npm test"

      - name: Functional Tests
        run: echo "TODO:\ npm run test:functional"
      
      - name: Security Audit (npm audit)
        run: echo "TODO:\ npm audit --audit-level=moderate"

