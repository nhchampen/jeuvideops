name: Reusable Game Check

on:
  workflow_call:
    inputs:
      game-path:
        required: true
        type: string

jobs:
  lint-test-audit:
    runs-on: ubuntu-latest
    steps:
      # Step 1 : Get source code
      - name: Checkout repository
        uses: actions/checkout@v4

      # Step 2 : Install Node.js (with cache if allowed)
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ${{ inputs.game-path }}/package-lock.json
        continue-on-error: true # Doesn't block if cached failed

      # Step 3 : Install dependencies (if package.json available)
      - name: Install dependencies
        run: |
          if [ -f "package.json" ]; then
            echo "Installing dependencies..."
            npm install
          else
            echo "No package.json found, skipping npm install"
          fi

      # Placeholder for futurs steps
      # Changes echo with the real commands
      - name: Unit Tests
        run: echo "TODO:\ npm test"

      - name: Run npm audit
        run: |
          cd ${{ inputs.game-path }}
          npm audit --json > audit-report.json || true

      - name: Upload audit report
        uses: actions/upload-artifact@v4
        with:
          name: audit-report-${{ inputs.game-path | replace('/', '-') }}
          path: ${{ inputs.game-path }}/audit-report.json
          retention-days: 7