name: Reusable Game Check

on:
  workflow_call:
    inputs:
      game-path:
        required: true
        type: string

jobs:
  lint-test-audit:
    runs-on: ubuntu-latest
    steps:
      # Step 1 : Get source code
      - name: Checkout repository
        uses: actions/checkout@v4

      # Step 2 : Check for the package-lock.json
      - name: Check for package-lock.json
        id: check_lock
        run: |
          if [ -f "${{ inputs.game-path }}/package-lock.json" ]; then
            echo "has_lock=true" >> $GITHUB_OUTPUT
          fi

      # Step 3 : Install Node.js (with cache if allowed)
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: ${{ steps.check_lock.outputs.has_lock == 'true' && 'npm' || '' }}
          cache-dependency-path: ${{ inputs.game-path }}/package-lock.json

      # Step 4 : Install dependencies (if package.json available)
      - name: Install dependencies
        run: |
          if [ -f "package.json" ]; then
            echo "Installing dependencies..."
            npm install
          else
            echo "No package.json found, skipping npm install"
          fi

      - name: Unit Tests
        run: npm test -- --testPathPatterns=utils.test.js

      - name: Functionnal Tests
        run: npm test -- --testPathPatterns=functional.test.js

      - name: Run npm audit
        run: |
          cd ${{ inputs.game-path }}
          npm audit --json > audit-report.json || true

      - name: Generate safe artifact name
        id: artifact-name
        run: |
          # Extract the last segment of the path (name of the directory game)
          GAME_NAME=$(basename "${{ inputs.game-path }}")
          # Replace untrusty char 
          SAFE_NAME=$(echo "$GAME_NAME" | sed 's/[^a-zA-Z0-9-]/-/g')
          echo "safe_name=$SAFE_NAME" >> $GITHUB_OUTPUT

      - name: Upload audit report
        uses: actions/upload-artifact@v4
        with:
          name: audit-report-${{ steps.artifact-name.outputs.safe_name }}-${{ github.run_id }}
          path: ${{ inputs.game-path }}/audit-report.json
          retention-days: 7