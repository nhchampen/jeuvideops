<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>JEUVIDEOPS — Arcade</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Bebas+Neue&display=swap" rel="stylesheet">
  <style>
    :root {
      --cyan:   #00ffe7;
      --magenta:#ff2d78;
      --yellow: #ffe600;
      --bg:     #050810;
      --panel:  #0a0f1e;
      --grid:   rgba(0,255,231,0.04);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%; height: 100%;
      background: var(--bg);
      color: var(--cyan);
      font-family: 'Share Tech Mono', monospace;
      overflow: hidden;
    }

    /* ── CRT overlay ── */
    body::before {
      content: '';
      position: fixed; inset: 0; z-index: 100;
      pointer-events: none;
      background:
        repeating-linear-gradient(
          0deg,
          transparent,
          transparent 2px,
          rgba(0,0,0,.18) 2px,
          rgba(0,0,0,.18) 4px
        );
    }
    body::after {
      content: '';
      position: fixed; inset: 0; z-index: 101;
      pointer-events: none;
      background: radial-gradient(ellipse at center, transparent 60%, rgba(0,0,0,.7) 100%);
    }

    /* ── Grid background ── */
    .bg-grid {
      position: fixed; inset: 0; z-index: 0;
      background-image:
        linear-gradient(var(--grid) 1px, transparent 1px),
        linear-gradient(90deg, var(--grid) 1px, transparent 1px);
      background-size: 48px 48px;
      animation: grid-drift 40s linear infinite;
    }
    @keyframes grid-drift {
      from { background-position: 0 0; }
      to   { background-position: 0 480px; }
    }

    /* ── Scanline flicker ── */
    .flicker {
      position: fixed; inset: 0; z-index: 1;
      pointer-events: none;
      animation: flicker 0.15s infinite;
      opacity: 0;
    }
    @keyframes flicker {
      0%,100% { opacity: 0; }
      92%      { opacity: 0; }
      93%      { opacity: 0.03; }
      94%      { opacity: 0; }
      96%      { opacity: 0.04; }
    }

    /* ── Layout ── */
    .screen {
      position: relative; z-index: 10;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      width: 100%; height: 100%;
      gap: 0;
    }

    /* ── Header ── */
    .header {
      text-align: center;
      margin-bottom: 12px;
    }
    .logo {
      font-family: 'Bebas Neue', sans-serif;
      font-size: clamp(3.5rem, 10vw, 8rem);
      letter-spacing: 0.12em;
      line-height: 1;
      color: transparent;
      background: linear-gradient(135deg, var(--cyan) 0%, var(--magenta) 100%);
      -webkit-background-clip: text;
      background-clip: text;
      filter: drop-shadow(0 0 18px rgba(0,255,231,.5)) drop-shadow(0 0 40px rgba(255,45,120,.3));
      animation: logo-pulse 3s ease-in-out infinite;
    }
    @keyframes logo-pulse {
      0%,100% { filter: drop-shadow(0 0 18px rgba(0,255,231,.5)) drop-shadow(0 0 40px rgba(255,45,120,.3)); }
      50%      { filter: drop-shadow(0 0 30px rgba(0,255,231,.9)) drop-shadow(0 0 60px rgba(255,45,120,.6)); }
    }
    .tagline {
      font-size: .75rem;
      letter-spacing: .4em;
      color: rgba(0,255,231,.45);
      text-transform: uppercase;
      margin-top: 4px;
    }

    /* ── Insert coin ── */
    .insert-coin {
      font-size: .8rem;
      letter-spacing: .3em;
      color: var(--yellow);
      text-transform: uppercase;
      margin-bottom: 40px;
      animation: blink 1.1s step-end infinite;
    }
    @keyframes blink { 50% { opacity: 0; } }

    /* ── Cards container ── */
    .cards {
      display: flex;
      gap: 32px;
      flex-wrap: wrap;
      justify-content: center;
      padding: 0 24px;
    }

    /* ── Game card ── */
    .card {
      position: relative;
      width: 280px;
      border: 1px solid rgba(0,255,231,.2);
      background: var(--panel);
      padding: 36px 28px 28px;
      cursor: pointer;
      text-decoration: none;
      color: inherit;
      display: flex; flex-direction: column; gap: 12px;
      transition: transform .2s ease, border-color .2s ease;
      overflow: hidden;
    }
    .card::before {
      content: '';
      position: absolute; inset: 0;
      background: linear-gradient(135deg, rgba(0,255,231,.06), transparent 60%);
      opacity: 0;
      transition: opacity .3s;
    }
    .card::after {
      content: '';
      position: absolute;
      top: 0; left: -100%;
      width: 60%; height: 100%;
      background: linear-gradient(90deg, transparent, rgba(0,255,231,.08), transparent);
      transition: left .45s ease;
    }
    .card:hover { transform: translateY(-6px); border-color: var(--cyan); }
    .card:hover::before { opacity: 1; }
    .card:hover::after  { left: 140%; }

    /* corner brackets */
    .card .bracket {
      position: absolute;
      width: 14px; height: 14px;
      border-color: var(--magenta);
      border-style: solid;
    }
    .card .bracket.tl { top: 6px;  left: 6px;  border-width: 2px 0 0 2px; }
    .card .bracket.tr { top: 6px;  right: 6px; border-width: 2px 2px 0 0; }
    .card .bracket.bl { bottom: 6px; left: 6px;  border-width: 0 0 2px 2px; }
    .card .bracket.br { bottom: 6px; right: 6px; border-width: 0 2px 2px 0; }

    /* number badge */
    .card-num {
      position: absolute;
      top: 10px; right: 14px;
      font-size: .65rem;
      color: rgba(255,45,120,.6);
      letter-spacing: .15em;
    }

    /* icon area */
    .card-icon {
      font-size: 2.8rem;
      line-height: 1;
      filter: drop-shadow(0 0 8px currentColor);
    }

    .card-title {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 1.6rem;
      letter-spacing: .1em;
      color: #fff;
      text-shadow: 0 0 12px var(--cyan);
      line-height: 1.1;
    }

    .card-desc {
      font-size: .7rem;
      color: rgba(0,255,231,.5);
      letter-spacing: .08em;
      line-height: 1.6;
    }

    .card-btn {
      margin-top: auto;
      display: inline-flex; align-items: center; gap: 8px;
      font-family: 'Share Tech Mono', monospace;
      font-size: .72rem;
      letter-spacing: .2em;
      text-transform: uppercase;
      color: var(--bg);
      background: var(--cyan);
      padding: 9px 18px;
      border: none;
      cursor: pointer;
      clip-path: polygon(8px 0%, 100% 0%, calc(100% - 8px) 100%, 0% 100%);
      transition: background .2s, color .2s;
    }
    .card:hover .card-btn {
      background: var(--magenta);
    }
    .card-btn .arrow { transition: transform .2s; }
    .card:hover .card-btn .arrow { transform: translateX(4px); }

    /* ── Footer ── */
    .footer {
      margin-top: 40px;
      font-size: .6rem;
      letter-spacing: .25em;
      color: rgba(0,255,231,.2);
      text-align: center;
    }

    /* ── Glitch on hover ── */
    @keyframes glitch {
      0%   { clip-path: inset(20% 0 60% 0); transform: translate(-3px,0); }
      20%  { clip-path: inset(50% 0 20% 0); transform: translate(3px,0); }
      40%  { clip-path: inset(80% 0  5% 0); transform: translate(-2px,0); }
      60%  { clip-path: inset(10% 0 75% 0); transform: translate(2px,0); }
      80%  { clip-path: inset(40% 0 40% 0); transform: translate(-1px,0); }
      100% { clip-path: inset(0% 0 100% 0); transform: translate(0,0); }
    }
    .logo:hover {
      animation: logo-pulse 3s ease-in-out infinite, glitch-logo .4s steps(1) 1;
    }
    @keyframes glitch-logo {
      0%,100% { text-shadow: none; }
      25% { text-shadow: 3px 0 var(--magenta), -3px 0 var(--cyan); letter-spacing: .15em; }
      50% { text-shadow: -3px 0 var(--magenta),  3px 0 var(--cyan); letter-spacing: .10em; }
      75% { text-shadow: 3px 0 var(--cyan), -3px 0 var(--magenta); }
    }
  </style>
</head>
<body>
  <div class="bg-grid"></div>
  <div class="flicker"></div>

  <div class="screen">
    <div class="header">
      <div class="logo">JEUVIDEOPS</div>
      <div class="tagline">// arcade selection screen //</div>
    </div>

    <div class="insert-coin">▶ select your game ◀</div>

    <div class="cards">

      <!-- Spaceword -->
      <a class="card" href="games/spaceword/index.html">
        <span class="bracket tl"></span>
        <span class="bracket tr"></span>
        <span class="bracket bl"></span>
        <span class="bracket br"></span>
        <span class="card-num">GAME_01</span>
        <div class="card-icon" style="color:var(--cyan)">🛸</div>
        <div class="card-title">SPACEWORD</div>
        <div class="card-desc">
          A word game set in outer space.
        </div>
        <button class="card-btn">PLAY <span class="arrow">→</span></button>
      </a>

      <!-- Two Ships Passing in the Night -->
      <a class="card" href="games/two-ships-passing-in-the-night/index.html">
        <span class="bracket tl"></span>
        <span class="bracket tr"></span>
        <span class="bracket bl"></span>
        <span class="bracket br"></span>
        <span class="card-num">GAME_02</span>
        <div class="card-icon" style="color:var(--magenta)">🚀</div>
        <div class="card-title">TWO SHIPS PASSING IN THE NIGHT</div>
        <div class="card-desc">
          A 3D space game for two.
        </div>
        <button class="card-btn">PLAY <span class="arrow">→</span></button>
      </a>

    </div>

    <div class="footer">© JEUVIDEOPS — ALL SYSTEMS NOMINAL — v1.0.0</div>
  </div>
</body>
</html>
